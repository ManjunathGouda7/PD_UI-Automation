version: '3.8'

services:
  pd-test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pd-test-runner
    environment:
      - DUT_IP=${DUT_IP:-192.168.102.76}
      - DUT_PORT=${DUT_PORT:-5003}
      - BASE_URL=${BASE_URL:-http://localhost:5003/v1.1.1.html}
      - HEADLESS=true
      - APP_ENV=ci
    volumes:
      - ./Reports:/app/Reports
      - ./logs:/app/logs
      - ./allure-results:/app/allure-results
    network_mode: host

  allure-report:
    image: frankescobar/allure-docker-service:latest
    container_name: pd-allure-service
    environment:
      - CHECK_RESULTS_EVERY_SECONDS=3
      - KEEP_HISTORY=1
    ports:
      - "5050:5050"
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/default-reports
    depends_on:
      - pd-test-runner
