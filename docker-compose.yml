services:
  pd-test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pd-test-runner
    environment:
      # host.docker.internal reaches the GRL software running on the Docker host (Windows/macOS).
      - BASE_URL=${BASE_URL:-http://host.docker.internal:5003}
      - DUT_IP=${DUT_IP:-192.168.255.1}
      - HEADLESS=true
      - APP_ENV=ci
      - ALLOW_HW_ACTIONS=${ALLOW_HW_ACTIONS:-false}
    command: ["python", "run.py", "--mode", "${TEST_MODE:-smoke}", "--allure"]
    volumes:
      - ./Reports:/app/Reports
      - ./logs:/app/logs
      - ./allure-results:/app/allure-results
    extra_hosts:
      - "host.docker.internal:host-gateway"

  allure-report:
    image: frankescobar/allure-docker-service:2.44.0
    container_name: pd-allure-service
    environment:
      - CHECK_RESULTS_EVERY_SECONDS=3
      - KEEP_HISTORY=1
    ports:
      - "5050:5050"
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/default-reports
