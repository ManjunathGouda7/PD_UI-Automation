name: GRL USB PD C2 UI Automation CI

on:
  push:
    branches: [ main, Sub ]
  pull_request:
    branches: [ main, Sub ]
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test Scope'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - all

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          pip install ruff
          ruff check .

  test-execution:
    name: Headless Playwright Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          pip install -r requirements.txt
          playwright install chromium
      - run: |
          python -m pytest -c Configurations/pytest.ini Scripts/TestCases -m smoke --alluredir=allure-results -v
        env:
          HEADLESS: 'true'
          BASE_URL: 'http://localhost:5003/v1.1.1.html'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pd-test-reports
          path: |
            Reports/
            logs/
            allure-results/
