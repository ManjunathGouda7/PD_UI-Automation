[pytest]
addopts = -v -p no:faulthandler
testpaths = Scripts/TestCases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: quick smoke sanity tests
    regression: complete compliance test suite
    connection: connection setup panel tests
    product_cap: product capability panel tests
    test_config: test configuration panel tests
    results: results panel tests
    report: report generation and export tests
    configure: configure panel tests
    loopback: loopback test suite
    help: help and diagnostics tests
